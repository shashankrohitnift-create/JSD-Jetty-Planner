<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRI Jetty Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
<script>try{var t=localStorage.getItem("jp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="top-left">
  <a class="brand" href="https://gembaconcepts.com/" target="_blank" rel="noopener" title="Gemba Concepts · gembaconcepts.com"><img src="/static/gemba-logo.png" alt="Gemba Concepts"></a>
  <div>
    <h1>Jetty Planner</h1>
    <div class="top-sub">DRI plant · 600 m jetty</div>
  </div>
  </div>
  <div class="top-right">
    <div class="verdict" id="head-verdict"></div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch light / dark">
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="tt-label">Dark</span>
    </button>
  </div>
</header>

<div class="wrap">
  <aside class="panel" id="panel" aria-label="Model inputs"></aside>
  <main>
    <div id="banner"></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="plan" aria-selected="true"><span class="step">1A</span>Shipment plan</button>
      <button class="tab" role="tab" data-tab="combos" aria-selected="false"><span class="step">1B</span>Ship combinations</button>
      <button class="tab" role="tab" data-tab="sim" aria-selected="false"><span class="step">2</span>Simulation</button>
      <button class="tab" role="tab" data-tab="cal" aria-selected="false"><span class="step">3</span>Calendar</button>
      <button class="tab" role="tab" data-tab="vplan" aria-selected="false">Vessel plan</button>
      <button class="tab" role="tab" data-tab="res" aria-selected="false">Extra resources</button>
      <button class="tab" role="tab" data-tab="sim2d" aria-selected="false">Simulator</button>
      <button class="tab" role="tab" data-tab="runs" aria-selected="false">Saved runs</button>
      <button class="tab" role="tab" data-tab="method" aria-selected="false">Method</button>
      <button class="btn-q sim-toggle" id="sim-toggle" type="button" aria-pressed="true">Hide simulator</button>
    </nav>
    <section class="pane" id="pane-plan"></section>
    <section class="pane hide" id="pane-combos"></section>
    <section class="pane hide" id="pane-sim"></section>
    <section class="pane hide" id="pane-cal"></section>
    <section class="pane hide" id="pane-vplan"></section>
    <section class="pane hide" id="pane-res"></section>
    <section class="pane hide" id="pane-sim2d"><div class="card sim-view"><canvas id="sim2d-canvas" aria-label="2D jetty simulator"></canvas></div></section>
    <section class="pane hide" id="pane-runs"></section>
    <section class="pane hide" id="pane-method"></section>
  </main>
</div>
<script src="/static/app.js"></script>
<script src="/static/sim.js"></script>
<script src="/static/resources.js"></script>
<script src="/static/vessel.js"></script>
<footer class="site-foot">Gemba Concepts Pvt Ltd · <a href="https://gembaconcepts.com/" target="_blank" rel="noopener">gembaconcepts.com</a></footer>
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('theme-toggle'), mq=window.matchMedia('(prefers-color-scheme: dark)');
  function isDark(){return root.dataset.theme?root.dataset.theme==='dark':mq.matches;}
  function paint(){var d=isDark();btn.querySelector('.tt-label').textContent=d?'Light':'Dark';btn.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');btn.classList.toggle('is-dark',d);}
  btn.addEventListener('click',function(){var next=isDark()?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('jp-theme',next);}catch(e){}paint();});
  if(mq.addEventListener)mq.addEventListener('change',paint);
  paint();
})();
</script>
</body>
</html>
